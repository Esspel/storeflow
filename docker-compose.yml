version: "3.8"

# ── StoreFlow self-hosted setup ───────────────────────────────────────────────
# Prerequisites:
#   1. Copy .env.example to .env and fill in VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY
#   2. Apply migrations from supabase/migrations/ to your Supabase project
#   3. docker compose up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: storeflow_app
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - storeflow
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  storeflow:
    driver: bridge
